<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Slate Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Border Sheen -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <!-- Brand Vibrant Orange to Warm Amber Gradient for M -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45" />
      <stop offset="50%" stop-color="#FE6334" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Accent Dot Gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FE6334" />
    </linearGradient>

    <!-- Radial Soft Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FE6334" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FE6334" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#FE6334" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Squircle Body -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#centerGlow)" />

  <!-- Fine Inner Border Highlight -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Monogram Soft Shadow Glow -->
  <path
    d="M 17.5 43 L 17.5 22 L 32 36 L 46.5 22 L 46.5 43"
    fill="none"
    stroke="#FE6334"
    stroke-opacity="0.4"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Core Crisp "M" Monogram -->
  <path
    d="M 17.5 43 L 17.5 22 L 32 36 L 46.5 22 L 46.5 43"
    fill="none"
    stroke="url(#mGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Electric Spark Accent Dot -->
  <circle cx="46.5" cy="14" r="3.2" fill="url(#dotGrad)" filter="url(#glow)" />
  <circle cx="46.5" cy="14" r="1.8" fill="#FFFBEB" />
</svg>
